server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/apsas_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379

# Logging cho môi trường DB
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
  file:
    name: logs/db.log

spring:
  profiles:
    active: db
