server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: never

spring:
  application:
    name: CodeVerse
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    model:
      chat: openai
    openai:
      api-key: ${GEMINI_API_KEY}        # dùng Gemini API key
      chat:
        base-url: https://generativelanguage.googleapis.com
        api-key: ${GEMINI_API_KEY}     # hoặc spring.ai.openai.chat.api-key (tùy version)
        options:
          model: gemini-2.5-flash
        completions-path: /v1beta/openai/chat/completions
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 1000
      thread-name-prefix: app-async-
  datasource:
    url: jdbc:mysql://127.0.0.1:3308/apsas_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: user
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB

  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.json.use.type.headers: true
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.project.apsas.*"
      group-id: group_one
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.use.type.headers: true
    listener:
      ack-mode: manual_immediate
      concurrency: 3
#logging:
#  level:
#    org.springframework.kafka.config: DEBUG
#    org.springframework.kafka.listener: DEBUG

