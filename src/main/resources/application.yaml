server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: never

spring:
  application:
    name: CodeVerse
  data:
    redis:
      host: localhost
      port: 6379
  ai:
    model:
      chat: openai
    openai:
      api-key: ${GEMINI_API_KEY}        # dùng Gemini API key
      chat:
        base-url: https://generativelanguage.googleapis.com
        api-key: ${GEMINI_API_KEY}     # hoặc spring.ai.openai.chat.api-key (tùy version)
        options:
          model: gemini-2.5-flash
        completions-path: /v1beta/openai/chat/completions
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 1000
      thread-name-prefix: app-async-
  datasource:
    url: jdbc:mysql://127.0.0.1:3308/apsas_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: user
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Connection pool settings
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000      # 30 seconds
      idle-timeout: 600000           # 10 minutes
      max-lifetime: 1800000          # 30 minutes
      # Prevent connection leak
      leak-detection-threshold: 60000 # 1 minute

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        # Transaction timeout settings
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        # Lock timeout (milliseconds) - prevent deadlock waiting forever
        jakarta.persistence.lock.timeout: 10000  # 10 seconds
        # Query timeout (seconds)
        jakarta.persistence.query.timeout: 30
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
  security:
      oauth2:
        client:
          registration:
            google:
              client-id: 983975577912-h8to98gdaf2eliiakkcmjohstg3ftp7a.apps.googleusercontent.com
              client-secret: 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
              scope: email, profile
          provider:
            google:
              authorization-uri: https://accounts.google.com/o/oauth2/auth
              token-uri: https://oauth2.googleapis.com/token
              user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
  frontend:
    url: http://localhost:5173
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.json.use.type.headers: true
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.project.apsas.*"
      group-id: group_one
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.use.type.headers: true
    listener:
      ack-mode: manual_immediate
      concurrency: 3
